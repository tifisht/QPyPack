name: Build and Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to build (for example v2.9.2rc1)
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI after all validation (upstream repository only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Validate release tag and source commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          python scripts/release.py prepare --tag "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

  python-packages:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
          python -m pip install build twine packaging
      - name: Build, rebuild sdist, install and launch Python distributions
        run: |
          python scripts/release.py stage --tag "$RELEASE_TAG"
          python scripts/release.py python --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-python
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-python
          path: validation/
          if-no-files-found: ignore

  build-binaries:
    name: Package (${{ matrix.platform }})
    needs: prepare
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
          - os: ubuntu-22.04
            platform: linux
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install packaging pyinstaller
      - name: Apply release version and install project
        shell: bash
        run: |
          python scripts/release.py stage --tag "$RELEASE_TAG"
          python -m pip install -e .
      - name: Build archives and launch the extracted application
        shell: bash
        run: python scripts/release.py native --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.platform }}
          path: validation/
          if-no-files-found: ignore

  github-release:
    needs: [prepare, python-packages, build-binaries]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets/
          merge-multiple: true
      - name: Verify complete asset set, source and checksums
        run: python scripts/release.py verify --tag "$RELEASE_TAG"
      - name: Publish complete GitHub Release without replacing an existing version
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
            echo 'Release already exists; refusing to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "QPyPack $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

  publish-pypi:
    needs: [prepare, github-release]
    if: github.repository == 'Qwejay/QPyPack' && github.event.repository.fork == false && (github.event_name == 'push' || inputs.publish_pypi)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-python
          path: python-distributions/
      - name: Select the already validated Python distributions
        run: |
          mkdir dist
          cp python-distributions/*.whl python-distributions/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
